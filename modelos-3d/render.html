<!doctype html>
<html>
<head>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three'
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js'

const p = new URLSearchParams(location.search)
const L = +p.get('l'), W = +p.get('w'), H = +p.get('h')
const cor = new THREE.Color(p.get('cor'))
const LARG = 1600, ALT = 1200

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true })
renderer.setPixelRatio(1)
renderer.setSize(LARG, ALT)
renderer.setClearColor(0x000000, 0)
renderer.shadowMap.enabled = true
renderer.shadowMap.type = THREE.PCFSoftShadowMap
renderer.outputColorSpace = THREE.SRGBColorSpace
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 1.05
document.body.appendChild(renderer.domElement)

const cena = new THREE.Scene()
const plastico = new THREE.MeshStandardMaterial({ color: cor, roughness: 0.62, metalness: 0 })
const plasticoEscuro = new THREE.MeshStandardMaterial({ color: cor.clone().multiplyScalar(0.82), roughness: 0.7 })
const preto = new THREE.MeshStandardMaterial({ color: 0x141414, roughness: 0.45 })
const fresta = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 1 })
const etiqueta = new THREE.MeshStandardMaterial({ color: 0xf4f4f4, roughness: 0.9 })

const g = new THREE.Group()
const add = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; g.add(m); return m }

const hCorpo = H * 0.7, hTampa = H * 0.3
// corpo (um pouco mais estreito em baixo dá a forma de caixa moldada)
add(new RoundedBoxGeometry(L, hCorpo, W, 4, 0.035), plastico, 0, hCorpo / 2, 0)
// fresta entre corpo e tampa
add(new THREE.BoxGeometry(L + 0.006, 0.012, W + 0.006), fresta, 0, hCorpo + 0.004, 0)
// tampa com aba
add(new RoundedBoxGeometry(L + 0.04, hTampa, W + 0.04, 4, 0.04), plastico, 0, hCorpo + 0.01 + hTampa / 2, 0)
// nervuras verticais nas laterais longas
const nNerv = Math.max(3, Math.round(L / 0.28))
for (let i = 0; i <= nNerv; i++) {
  const x = -L / 2 + 0.06 + (i * (L - 0.12)) / nNerv
  for (const z of [W / 2 + 0.008, -W / 2 - 0.008])
    add(new RoundedBoxGeometry(0.07, hCorpo - 0.06, 0.03, 2, 0.01), plasticoEscuro, x, hCorpo / 2 - 0.01, z)
}
// nervuras nas pontas
for (const x of [L / 2 + 0.008, -L / 2 - 0.008])
  for (const z of [-W / 4, W / 4])
    add(new RoundedBoxGeometry(0.03, hCorpo - 0.06, 0.07, 2, 0.01), plasticoEscuro, x, hCorpo / 2 - 0.01, z)
// pinos octogonais da tampa
const topo = hCorpo + 0.01 + hTampa
const passo = 0.13
const nx = Math.max(3, Math.floor((L - 0.06) / passo)), nz = Math.max(3, Math.floor((W - 0.04) / passo))
const pino = new THREE.CylinderGeometry(0.045, 0.05, 0.04, 8)
for (let i = 0; i < nx; i++) for (let k = 0; k < nz; k++) {
  const m = add(pino, plastico, -((nx - 1) * passo) / 2 + i * passo, topo + 0.02, -((nz - 1) * passo) / 2 + k * passo)
  m.rotation.y = Math.PI / 8
}
// fechos e alças na frente
const nFechos = L > 1.6 ? 4 : L > 1.15 ? 3 : 2
for (let i = 0; i < nFechos; i++) {
  const x = -L / 2 + (L * (i + 0.5)) / nFechos
  add(new THREE.BoxGeometry(0.06, 0.12, 0.025), preto, x, hCorpo - 0.02, W / 2 + 0.035)
  add(new THREE.BoxGeometry(0.11, 0.03, 0.03), preto, x, hCorpo * 0.55, W / 2 + 0.04)
  add(new THREE.BoxGeometry(0.02, 0.06, 0.03), preto, x - 0.045, hCorpo * 0.55 + 0.03, W / 2 + 0.035)
  add(new THREE.BoxGeometry(0.02, 0.06, 0.03), preto, x + 0.045, hCorpo * 0.55 + 0.03, W / 2 + 0.035)
}
// alças das pontas
for (const s of [1, -1]) {
  add(new THREE.BoxGeometry(0.03, 0.03, 0.14), preto, s * (L / 2 + 0.04), hCorpo * 0.62, 0)
  add(new THREE.BoxGeometry(0.025, 0.1, 0.05), preto, s * (L / 2 + 0.03), hCorpo - 0.02, 0)
}
// alças pretas da tampa (nas pontas)
for (const s of [1, -1]) add(new THREE.BoxGeometry(0.03, 0.035, 0.18), preto, s * (L / 2 + 0.03), topo - 0.03, 0)
// etiqueta
add(new THREE.BoxGeometry(0.09, 0.13, 0.004), etiqueta, L * 0.12, hCorpo * 0.6, W / 2 + 0.026)

g.position.y = 0
cena.add(g)

// chão só com sombra
const chao = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity: 0.22 }))
chao.rotation.x = -Math.PI / 2
chao.receiveShadow = true
cena.add(chao)

cena.add(new THREE.HemisphereLight(0xffffff, 0x8a8a8a, 1.6))
const sol = new THREE.DirectionalLight(0xffffff, 2.4)
sol.position.set(-2.5, 5, 4)
sol.castShadow = true
sol.shadow.mapSize.set(2048, 2048)
sol.shadow.camera.left = -3; sol.shadow.camera.right = 3; sol.shadow.camera.top = 3; sol.shadow.camera.bottom = -3
sol.shadow.radius = 6
cena.add(sol)
const rebate = new THREE.DirectionalLight(0xffffff, 0.6)
rebate.position.set(3, 2, -2)
cena.add(rebate)

// mesmo ângulo para todas: 3/4 frontal, de cima
const camera = new THREE.PerspectiveCamera(28, LARG / ALT, 0.1, 50)
const dir = new THREE.Vector3(-0.55, 0.62, 1).normalize()
const caixaB = new THREE.Box3().setFromObject(g)
const centro = caixaB.getCenter(new THREE.Vector3())
// distância fixa baseada na maior caixa, para manter a escala real entre modelos
const raioRef = caixaB.getBoundingSphere(new THREE.Sphere()).radius
camera.position.copy(centro).addScaledVector(dir, raioRef / Math.sin(THREE.MathUtils.degToRad(14)) * 1.02)
camera.lookAt(centro)
renderer.render(cena, camera)
window.pronto = true
</script>
</body>
</html>
