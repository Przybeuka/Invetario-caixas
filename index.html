<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Inventário de Caixas</title>
    <meta name="description" content="Consulta e conferência de materiais por caixa." />
    <meta name="theme-color" content="#18181b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Inventário" />
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('tema')
          var escuro =
            t === 'escuro' ||
            ((!t || t === 'sistema') && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (escuro) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      ;(function () {
        var erros = []
        function mostrar() {
          var raiz = document.getElementById('root')
          if (!raiz || raiz.children.length) return
          raiz.innerHTML =
            '<div style="font:14px -apple-system,sans-serif;padding:24px;max-width:560px;margin:0 auto">' +
            '<h1 style="font-size:20px;margin:0 0 8px">Não foi possível abrir o app</h1>' +
            '<p style="color:#52525b;margin:0 0 12px">Feche e abra de novo. Se persistir, envie esta mensagem:</p>' +
            '<pre style="white-space:pre-wrap;word-break:break-word;background:#f4f4f5;color:#18181b;padding:12px;border-radius:8px;font-size:12px"></pre></div>'
          raiz.querySelector('pre').textContent = (erros.join('\n') || 'sem detalhes') + '\n' + navigator.userAgent
        }
        window.addEventListener('error', function (e) {
          erros.push((e.message || 'erro') + (e.filename ? ' @' + e.filename.split('/').pop() + ':' + e.lineno : ''))
          setTimeout(mostrar, 1500)
        })
        window.addEventListener('unhandledrejection', function (e) {
          erros.push('promessa: ' + ((e.reason && e.reason.message) || e.reason))
          setTimeout(mostrar, 1500)
        })
        setTimeout(mostrar, 6000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
